# Runs on the Hanzo Git act_runners (git.hanzo.ai); labels from
# hanzoai/.github/RUNNERS.md. The workspace's default members exclude vm-linux,
# so the Linux leg checks it by name.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: hanzo-build-macos-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    runs-on: hanzo-build-linux-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p vm-linux
