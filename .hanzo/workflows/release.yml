# A v* tag builds the CLI (macOS arm64, Linux arm64) and the guest image
# (kernel, initramfs, rootfs with vm-guest) and attaches them to the GitHub
# release the CLI downloads from (crates/vm-cli/src/assets.rs). Asset names:
#   hanzo-vm-<tag>-darwin-aarch64.tar.gz   hanzo-vm binary
#   hanzo-vm-<tag>-linux-aarch64.tar.gz    hanzo-vm binary
#   hanzo-vm-os-<tag>-aarch64.tar.gz       Image, initramfs.cpio.gz, rootfs.ext4
# Uploads use gh with the runner's GITHUB_TOKEN, as hanzoai/engine does.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: hanzoai/vm

jobs:
  cli-darwin:
    runs-on: hanzo-build-macos-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p hanzo-vm
      - run: codesign --entitlements vm.entitlements --force -s - target/release/hanzo-vm
      - run: tar czf "hanzo-vm-${TAG}-darwin-aarch64.tar.gz" -C target/release hanzo-vm
      - run: |
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "hanzo-vm-${TAG}-darwin-aarch64.tar.gz" --clobber

  cli-linux:
    runs-on: hanzo-build-linux-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p hanzo-vm
      - run: tar czf "hanzo-vm-${TAG}-linux-aarch64.tar.gz" -C target/release hanzo-vm
      - run: |
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "hanzo-vm-${TAG}-linux-aarch64.tar.gz" --clobber

  os:
    runs-on: hanzo-build-linux-arm64
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools debootstrap e2fsprogs busybox-static pax-utils cpio \
            build-essential bc flex bison libelf-dev libssl-dev curl xz-utils
      - run: cargo build -p vm-guest --target aarch64-unknown-linux-musl --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: ./scripts/prepare-rootfs.sh
        env:
          HANZO_VM_HOME: ${{ github.workspace }}/os
      - run: tar czf "hanzo-vm-os-${TAG}-aarch64.tar.gz" -C os Image initramfs.cpio.gz rootfs.ext4
      - run: |
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "hanzo-vm-os-${TAG}-aarch64.tar.gz" --clobber
