[workspace]
resolver = "2"
members = [
    "crates/vm-cli",
    "crates/vm-darwin",
    "crates/vm-linux",
    "crates/vm-ch",
    "crates/vm-proto",
    "crates/vm-proxy",
    "crates/vm-sdk",
    "crates/vm",
    "crates/vm-store",
    "crates/vm-guest",
]
# vm-darwin and vm-linux are platform-specific — only pulled in
# transitively via vm's cfg'd deps. Excluded from default builds
# so `cargo check` doesn't fail on the wrong OS.
default-members = [
    "crates/vm-cli",
    "crates/vm-proto",
    "crates/vm-proxy",
    "crates/vm-sdk",
    "crates/vm",
    "crates/vm-store",
    "crates/vm-guest",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
