[package]
name = "vm-guest"
version = "2.0.0"
edition = "2021"
description = "Guest init (PID 1) for Hanzo VM microVMs: mounts, vsock exec/fs/forward server"
license = "Apache-2.0"
repository = "https://github.com/hanzoai/vm"

[[bin]]
name = "vm-guest"
path = "src/main.rs"

[dependencies]
vm-proto = { version = "2.0.0", path = "../vm-proto" }
libc = "0.2"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4.45"
ignore = "0.4"
notify = "7"
