[package]
name = "hanzo-vm"
version = "2.0.1"
edition = "2021"
description = "Hanzo microVM CLI: boot a Linux guest, run a command, throw the disk away"
license = "Apache-2.0"
repository = "https://github.com/hanzoai/vm"
readme = "../../README.md"

[[bin]]
name = "hanzo-vm"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
vm-core = { version = "2.0.1", path = "../vm" }
vm-proto = { version = "2.0.1", path = "../vm-proto" }
vm-proxy = { version = "2.0.1", path = "../vm-proxy" }
vm-measure = { version = "2.0.1", path = "../vm-measure" }
vm-store = { version = "2.0.1", path = "../vm-store" }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
libc = "0.2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.45"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.22.1"
