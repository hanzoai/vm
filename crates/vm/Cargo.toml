[package]
name = "vm"
version = "0.1.3"
edition = "2021"
description = "Hanzo microVM: boot, exec, mounts, ports, checkpoints"
license = "Apache-2.0"
repository = "https://github.com/hanzoai/vm"

[dependencies]
vm-proto = { version = "0.1.3", path = "../vm-proto" }
anyhow = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
vm-darwin = { version = "0.1.3", path = "../vm-darwin" }
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
vm-linux = { version = "0.1.3", path = "../vm-linux" }
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
vm-ch = { version = "0.1.3", path = "../vm-ch" }
