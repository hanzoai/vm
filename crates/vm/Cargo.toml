[package]
name = "vm-core"
version = "2.0.1"
edition = "2021"
description = "Hanzo microVM: boot, exec, mounts, ports, checkpoints"
license = "Apache-2.0"
repository = "https://github.com/hanzoai/vm"

[lib]
name = "vm"

[dependencies]
vm-proto = { version = "2.0.1", path = "../vm-proto" }
vm-measure = { version = "2.0.1", path = "../vm-measure" }
anyhow = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
vm-darwin = { version = "2.0.1", path = "../vm-darwin" }
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
vm-linux = { version = "2.0.1", path = "../vm-linux" }
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
vm-ch = { version = "2.0.1", path = "../vm-ch" }
