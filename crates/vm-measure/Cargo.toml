[package]
name = "vm-measure"
version = "2.0.2"
edition = "2021"
description = "Measured boot for the Hanzo microVM: an extend-only register over what was loaded"
license = "Apache-2.0"
repository = "https://github.com/hanzoai/vm"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
